d /run/helper-scripts 0775 root root -
Z /run/helper-scripts/* 0644 root root -

## Fallback base for lockfile.sh when a caller has no per-user runtime dir
## (/run/user/$UID). Root-owned + sticky (1777), so unlike /tmp an unprivileged
## user cannot pre-create or symlink the base; per-user subdirs live under it.
## Kept separate from /run/helper-scripts, whose 'Z ...*' glob would reset a
## subdir's mode/ownership.
d /run/flocker 1777 root root -
