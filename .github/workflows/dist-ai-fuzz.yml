## AI-Assisted

## helper-scripts-specific: always run the dist-ai FUZZ suite on CI, in addition
## to the fast --core run in the standard "dist-ai tests" workflow. Runs the
## curl-prgrs end-to-end fuzz (helper-scripts-lib-tests-fuzz), which drives the
## real curl-prgrs against the fake-curl stub and checks the exit code against a
## behavior model. The coverage-guided Atheris variant skips unless atheris is
## installed.
##
## This is an INTENTIONAL per-repo workflow, NOT a managed consumer template
## (pkg_update_consumer_workflows must not overwrite it). It reuses the same
## reusable-dist-ai-tests.yml, passing the --fuzz category so it inherits the
## caller checkout, the dm-consumer.yml apt-packages/helper-scripts setup, and
## the per-suite timeout/log handling.
##
## Reusable docs:
## https://github.com/org-ai-assisted/developer-meta-files/blob/master/.github/workflows/reusable-dist-ai-tests.yml

name: dist-ai fuzz

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dist-ai-fuzz:
    uses: org-ai-assisted/developer-meta-files/.github/workflows/reusable-dist-ai-tests.yml@master
    with:
      categories: '--fuzz'
      ## The --fuzz lane runs ~10 helper-scripts fuzz suites at ~3-5 min each,
      ## which overruns the reusable's 20-min --core default and is cancelled.
      ## Give the whole lane real headroom (observed ~6 suites in ~20 min).
      timeout-minutes: 60
