## AI-Assisted

## Per-repo parameter overrides. Read at workflow runtime by the
## reusable workflows in developer-meta-files. Top-level keys
## mirror the consumer-template basename without the
## 'consumer-' prefix.
##
## Spec:
## https://github.com/org-ai-assisted/developer-meta-files/blob/master/agents/github-actions-consumer-templates.md

coverity:
  ## scan.coverity.com project name (org-ai-assisted-owned; the "/" is
  ## rejected in manual registration so the name is slash-free).
  project-name:    "org-ai-assisted-helper-scripts"
  canonical-repos: "org-ai-assisted/helper-scripts"

dist-ai-tests:
  ## safe-rm is a hard runtime dependency of this package (debian/control) that
  ## the git review tools require: git-review-scan.sh probes it with 'has
  ## safe-rm' under errexit, so an absent safe-rm kills the external-diff
  ## driver silently (empty output, rc 1) and git-meld-tests reports every
  ## adversarial case as a hidden change.
  ## curl + ncurses-bin (tput): curl-prgrs probes both with 'has' at startup, so
  ## curl_prgrs_test.sh (which drives the real curl-prgrs) FATALs without them.
  ## python3-z3: the curl-prgrs formal-verification core suite
  ## (helper-scripts-lib-tests-verify) hard-FAILs without Z3 (it must not
  ## silently disable itself).
  ## moreutils (sponge), jq, procps (pgrep), systemd (loginctl): unconditional
  ## load-time 'has' preconditions of set-keyboard-layout.sh, which set-grub-keymap
  ## sources whole. Absent, 'has sponge' aborts via error_handler before any test
  ## logic runs, so set-keyboard-layout-tests fails 2/4. None ship in trixie-slim.
  apt-packages: "python3 python3-pytest python3-hypothesis python3-pyqt5 safe-rm curl ncurses-bin python3-z3 moreutils jq procps systemd"
